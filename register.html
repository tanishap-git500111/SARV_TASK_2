{% extends "base.html" %}

{% block title %}
Register | Wanderly
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <p class="eyebrow">
            JOIN WANDERLY
        </p>

        <h2>
            Create Account
        </h2>

        <p class="text-muted">
            Start planning your next adventure.
        </p>


        <form
            method="POST"
            class="mt-4"
        >

            <label>
                Full Name
            </label>

            <input
                type="text"
                name="name"
                class="form-control"
                required
            >


            <label class="mt-3">
                Email
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                required
            >


            <label class="mt-3">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                minlength="6"
                required
            >


            <button
                class="btn pink-btn rounded-pill w-100 mt-4"
            >
                Create Account
            </button>

        </form>


        <p class="text-center mt-4">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
