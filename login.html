{% extends "base.html" %}

{% block title %}
Login | Wanderly
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <p class="eyebrow">
            WELCOME BACK
        </p>

        <h2>
            Login
        </h2>

        <p class="text-muted">
            Continue your travel journey.
        </p>


        <form
            method="POST"
            class="mt-4"
        >

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                required
            >


            <label class="mt-3">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                required
            >


            <button
                class="btn btn-dark rounded-pill w-100 mt-4"
            >
                Login
            </button>

        </form>


        <p class="text-center mt-4">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </p>

    </div>

</div>

{% endblock %}
